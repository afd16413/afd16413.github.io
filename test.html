<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading</title>
<style>
:root{--navy:#1f2d5c;--navy-soft:#dfe3ec;--gold:#f4c542;--bg:#eef0f4;--line:#d6dae3;--danger:#b42318;--danger-bg:#fde8e6;--success:#1a7f37}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222;font-size:15px;line-height:1.4}
button,input{font:inherit}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 20px}
.brand{font-size:18px;font-weight:700}
.brand span{opacity:.8;font-weight:400}
.title{flex:1;min-width:120px;font-size:14px;opacity:.9}
.topbar a{color:#fff;font-size:14px}
.student-name{width:170px;border:none;border-radius:3px;padding:6px 8px}
.timer{min-width:72px;text-align:center;background:#fff;color:var(--navy);padding:6px 12px;border-radius:3px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--gold)}
.btn{background:var(--gold);color:var(--navy);border:none;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.parts{display:flex;gap:4px;flex-wrap:wrap;background:var(--navy-soft);border-bottom:1px solid #c9ced8;padding:0 20px}
.parts button{background:transparent;border:none;color:var(--navy);font-size:14px;padding:9px 16px;cursor:pointer}
.parts button.active{background:#fff;border-top:3px solid var(--navy);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 118px)}
.passage,.questions{overflow:auto;padding:22px 30px 60px}
.passage{background:#fff;border-right:2px solid var(--line);line-height:1.65}
.passage h2{margin-top:0;color:var(--navy);font-size:20px}
.passage p{margin:0 0 14px;text-align:justify}
.questions{background:#fbfbfc}
.instr{font-weight:700;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #ddd}
.qhead{margin-top:22px;color:var(--navy);font-weight:700;font-size:16px}
.qinstr{margin:4px 0 14px;color:#444;font-style:italic;white-space:pre-line}
.notes{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 18px}
.nbox{text-align:center;font-size:18px;margin:0 0 8px}
.nh,.noteline,.nt{line-height:2;margin:10px 0}
.nh{font-weight:700}
.optbox{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:12px}
.optbox div{margin:4px 0}
.stmt{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-bottom:10px}
.stmt-text{margin-bottom:8px;line-height:1.5}
.opt{display:block;margin:5px 0;font-size:14px}
.tf label{display:inline-block;margin-right:18px;cursor:pointer;font-size:14px}
.qno{display:inline-block;min-width:26px;height:22px;line-height:22px;padding:0 4px;text-align:center;background:var(--navy);color:#fff;border-radius:2px;font-size:12px;font-weight:700;vertical-align:middle;margin-right:4px}
input.gap{width:130px;padding:3px 6px;border:1px solid #8a93a8;border-radius:2px;font-size:14px;margin:0 4px;vertical-align:middle}
input.short{width:280px;padding:6px;border:1px solid #8a93a8;border-radius:2px;font-size:14px}
select{padding:5px;font-size:14px;max-width:100%}
input.gap:focus,input.short:focus{outline:2px solid var(--gold)}
.result{background:#fff;border:2px solid var(--navy);border-radius:4px;padding:16px 18px;margin-bottom:20px}
.result h3{margin:0 0 8px;color:var(--navy)}
.result table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.result th,.result td{padding:6px 8px;text-align:left;border-bottom:1px solid #e3e6ee}
.result tr.ok td:last-child{color:var(--success);font-weight:700}
.result tr.bad td:last-child{color:var(--danger);font-weight:700}
.msg{background:var(--danger-bg);color:var(--danger);padding:12px 14px;border-radius:4px}
@media (max-width:820px){.split{grid-template-columns:1fr;height:auto}.passage,.questions{padding:18px 16px 32px}}
</style></head><body>
<header class="topbar">
  <div class="brand">IELTS <span>Academic Reading</span></div>
  <div class="title" id="testTitle">Loading…</div>
  <input class="student-name" id="studentName" placeholder="Your name" aria-label="Your name">
  <div class="timer" id="timer">--:--</div>
  <a href="index.html">All tests</a>
  <button class="btn" id="submitBtn" type="button" disabled>Submit</button>
</header>
<nav class="parts" id="partTabs"></nav>
<main class="split">
  <section class="passage" id="passage"></section>
  <section class="questions" id="questions"><div class="msg">Loading test…</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = i => String.fromCharCode(65 + i);
const TF = { TFNG: ["TRUE", "FALSE", "NOT GIVEN"], YNNG: ["YES", "NO", "NOT GIVEN"] };
const norm = v => String(v ?? "").toLowerCase().replace(/[.,;:!?]+$/, "").replace(/\s+/g, " ").trim();

const file = new URLSearchParams(location.search).get("t") || "";
let test = null, part = 0, submitted = false, secondsLeft = 0, timerId = null, resultHTML = "";
const responses = {};

async function init() {
  if (!/^[\w.-]+\.json$/.test(file)) return fail("This test link is not valid.");

  try {
    const res = await fetch("tests/" + file, { cache: "no-store" });
    if (!res.ok) throw new Error();
    test = await res.json();
  } catch {
    return fail("This test could not be loaded.");
  }

  $("testTitle").textContent = test.title;
  document.title = test.title;
  secondsLeft = test.time * 60;
  $("submitBtn").disabled = false;

  $("submitBtn").addEventListener("click", () => {
    if (confirm("Submit the test now?")) submitTest(false);
  });
  $("questions").addEventListener("input", onAnswer);
  $("questions").addEventListener("change", onAnswer);
  $("partTabs").addEventListener("click", e => {
    const b = e.target.closest("[data-part]");
    if (b) { part = Number(b.dataset.part); renderAll(); }
  });

  updateTimer();
  timerId = setInterval(() => {
    if (submitted) return;
    secondsLeft--;
    updateTimer();
    if (secondsLeft <= 0) submitTest(true);
  }, 1000);

  renderAll();
}

function fail(msg) {
  $("testTitle").textContent = "Test unavailable";
  $("questions").innerHTML = `<div class="msg">${esc(msg)}</div>`;
}

function updateTimer() {
  const left = Math.max(0, secondsLeft);
  $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  $("timer").classList.toggle("warn", left <= 300);
}

function renderAll() {
  $("partTabs").innerHTML = test.parts.map((_, i) =>
    `<button class="${i === part ? "active" : ""}" data-part="${i}">Reading Passage ${i + 1}</button>`).join("");

  const p = test.parts[part];
  const showLabels = test.labels !== false;
  $("passage").innerHTML = `<h2>${esc(p.passageTitle)}</h2>` +
    p.paragraphs.map((t, i) => `<p>${showLabels ? `<strong>${L(i)}</strong>&nbsp;&nbsp;` : ""}${esc(t)}</p>`).join("");

  $("questions").innerHTML = resultHTML +
    (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
    p.groups.map(renderGroup).join("");
}

function badge(nos) {
  return `<span class="qno">${nos.length > 1 ? `${nos[0]}–${nos[nos.length - 1]}` : nos[0]}</span>`;
}

function renderGroup(g) {
  const dis = submitted ? "disabled" : "";
  const head = `<div class="qhead">${esc(g.heading)}</div><div class="qinstr">${esc(g.instruction)}</div>`;

  if (g.type === "GAP") {
    const body = g.lines.map(line => {
      const cls = line.kind === "h" ? "nh" : line.kind === "t" ? "nt" : "noteline";
      const html = esc(line.text).replace(/\{(\d+)\}/g, (_, no) =>
        `<span class="qno">${no}</span><input class="gap" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off" spellcheck="false">`);
      return `<p class="${cls}">${html}</p>`;
    }).join("");
    return head + `<div class="notes">${g.box ? `<h3 class="nbox">${esc(g.box)}</h3>` : ""}${body}</div>`;
  }

  if (g.type === "MATCH") {
    const opts = g.options.map((o, i) => `<div><b>${L(i)}</b> ${esc(o)}</div>`).join("");
    const rows = g.items.map(item => {
      const no = item.nos[0];
      const sel = g.options.map((o, i) =>
        `<option value="${L(i)}" ${responses[no] === L(i) ? "selected" : ""}>${L(i)} — ${esc(o)}</option>`).join("");
      return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
        <select data-no="${no}" ${dis}><option value="">— choose —</option>${sel}</select></div>`;
    }).join("");
    return head + `<div class="optbox"><strong>Options</strong>${opts}</div>` + rows;
  }

  return head + g.items.map(item => renderItem(g, item, dis)).join("");
}

function renderItem(g, item, dis) {
  const no = item.nos[0];

  if (g.type === "TFNG" || g.type === "YNNG") {
    const opts = TF[g.type].map(o =>
      `<label><input type="radio" name="q${no}" value="${o}" data-no="${no}" ${responses[no] === o ? "checked" : ""} ${dis}> ${o}</label>`).join("");
    return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div><div class="tf">${opts}</div></div>`;
  }

  if (g.type === "MCQ") {
    const chosen = Array.isArray(responses[no]) ? responses[no] : [];
    const opts = item.options.map((o, i) => {
      const l = L(i);
      if (item.multi) {
        return `<label class="opt"><input type="checkbox" data-no="${no}" value="${l}" ${chosen.includes(l) ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
      }
      return `<label class="opt"><input type="radio" name="q${no}" value="${l}" data-no="${no}" ${responses[no] === l ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
    }).join("");
    return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>${opts}</div>`;
  }

  return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
    <input class="short" type="text" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off"></div>`;
}

function onAnswer(e) {
  const el = e.target;
  if (submitted || !el.dataset.no) return;
  const no = el.dataset.no;

  if (el.type === "checkbox") {
    const set = new Set(Array.isArray(responses[no]) ? responses[no] : []);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    responses[no] = [...set];
  } else if (el.type !== "radio" || el.checked) {
    responses[no] = el.value;
  }
}

function markItem(item) {
  if (item.multi) {
    const sel = Array.isArray(responses[item.nos[0]]) ? responses[item.nos[0]] : [];
    const ok = sel.length === item.answers.length && item.answers.every(a => sel.includes(a));
    return item.nos.map((no, i) => ({ no, ok, mine: sel.join(", "), correct: item.answers[i] ?? "" }));
  }
  const no = item.nos[0];
  const mine = responses[no] || "";
  const ok = mine !== "" && item.answers.some(a => norm(a) === norm(mine));
  return [{ no, ok, mine, correct: item.answers.join(" / ") }];
}

function submitTest(auto) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerId);
  $("submitBtn").disabled = true;

  const marks = test.parts
    .flatMap(p => p.groups.flatMap(g => g.items.flatMap(item => markItem(item))))
    .sort((a, b) => a.no - b.no);

  const correct = marks.filter(m => m.ok).length;
  const total = marks.length;
  const name = $("studentName").value.trim();

  const rows = marks.map(m =>
    `<tr class="${m.ok ? "ok" : "bad"}"><td>${m.no}</td><td>${esc(m.mine || "—")}</td><td>${esc(m.correct)}</td><td>${m.ok ? "✓" : "✗"}</td></tr>`).join("");

  resultHTML = `<div class="result">
    <h3>Result${name ? " – " + esc(name) : ""}${auto ? " (time up)" : ""}</h3>
    <p><strong>${correct} / ${total}</strong> correct (${total ? Math.round(correct / total * 100) : 0}%)</p>
    <table><thead><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  renderAll();
  $("questions").scrollTop = 0;
}

init();
</script>
</body></html>
